<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正負數減法訓練器｜數線版</title>
<style>
:root{font-family:"Microsoft JhengHei",system-ui,sans-serif;color:#233044;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:850px;margin:auto}.card{background:#fff;border:1px solid #dce3ed;border-radius:16px;padding:22px;margin-bottom:16px}[hidden]{display:none!important}h1{font-size:27px;margin:0 0 12px}h2{font-size:23px;margin:0 0 15px}p{line-height:1.65}.muted{color:#5c687a;font-size:14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-weight:bold}input,select,button{font:inherit}input,select{display:block;width:100%;padding:12px;border:1px solid #aeb9c9;border-radius:9px;margin-top:7px;background:white}button{cursor:pointer;border:0;border-radius:9px;padding:12px 18px;min-height:46px;background:#edf1f7;color:#233044}button:focus-visible{outline:3px solid #ea9800;outline-offset:2px}button:disabled{cursor:default}.primary{background:#2866c6;color:white}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.meta{display:flex;gap:10px;flex-wrap:wrap;color:#5c687a;font-size:14px}.problem{text-align:center;font-size:42px;font-weight:bold;margin:20px 0 12px}.prompt{text-align:center;font-size:21px;font-weight:bold;line-height:1.5}.direction{display:flex;justify-content:center;gap:16px;margin:16px 0}.direction button{font-size:20px;min-width:135px}.progress{height:8px;background:#e9eef5;border-radius:9px;margin-top:12px;overflow:hidden}.bar{height:100%;background:#2866c6}.feedback{padding:13px;border-radius:10px;background:#f1f4f8;line-height:1.65;margin-top:15px;min-height:54px}.good{background:#eaf5ee}.bad{background:#fff2e8}.line-scroll{overflow-x:auto;border:1px solid #d6e0eb;border-radius:12px;margin-top:12px;background:#fafcff;overscroll-behavior-x:contain}.line-inner{width:1008px;padding:0 0 12px}.line-inner svg{display:block;width:1008px;height:120px}.ticks{display:grid;grid-template-columns:repeat(21,48px)}.tick{padding:8px 0;margin:0 2px;border-radius:8px;min-width:44px;font-size:17px;border:1px solid transparent;background:#eef2f8;font-weight:bold}.tick:disabled{color:#233044;opacity:1}.tick.start{border:2px solid #2866c6;background:#eaf1fd}.tick.zero{box-shadow:inset 0 -3px #67748b}.tick.chosen{background:#ddede3;border:2px solid #298254}.tick.wrong{background:#fff0e6;border:2px solid #c45b14}.line-caption{font-size:14px;margin:10px 0 4px;color:#4c5f7b}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2866c6;margin-right:5px}.result-id{font-weight:bold;line-height:1.7}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.metric{background:#f1f5fb;border-radius:10px;padding:14px;text-align:center}.metric strong{display:block;font-size:30px;margin-top:6px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #dce3ed}.error{color:#ae3f1d}.sub{font-size:15px;font-weight:normal;color:#5c687a}@media(max-width:560px){body{padding:10px}.card{padding:16px}.fields{grid-template-columns:1fr 1fr;gap:10px}.problem{font-size:36px}.prompt{font-size:19px}h1{font-size:24px}.direction button{min-width:115px}.meta{font-size:13px}}
</style></head><body><main>
<section id="setup" class="card"><h1>正負數減法訓練器 <span class="sub">數線版</span></h1><p>① 選方向　② 點終點</p>
<div class="fields"><label>班級<input id="studentClass" maxlength="20" placeholder="例如：801"></label><label>座號<input id="studentNo" maxlength="10" inputmode="numeric" placeholder="例如：12"></label><label>姓名<input id="studentName" maxlength="30"></label><label>題數<select id="questionCount"><option>5</option><option selected>10</option><option>20</option></select></label></div>
<p class="muted">題目中的數字：−5～5；數線：−10～10，每格是 1。<br>同一次練習的算式不重複。再練一次不用重填資料。</p><p id="setupError" class="error" role="alert"></p><button id="startBtn" class="primary">開始練習</button></section>
<section id="quiz" class="card" hidden><div class="meta"><span id="who"></span><span id="counter"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="problem" class="problem"></div><div id="prompt" class="prompt"></div>
<div id="directionChoices" class="direction"><button data-direction="left">← 往左</button><button data-direction="right">往右 →</button></div>
<div class="line-caption"><span class="dot"></span><span id="lineCaption"></span></div><div id="lineScroll" class="line-scroll"><div class="line-inner"><svg id="lineSvg" viewBox="0 0 1008 120" role="img" aria-label="數線"></svg><div id="ticks" class="ticks"></div></div></div>
<p class="muted">可左右滑動數線，查看每一格的數字。</p><div id="feedback" class="feedback" aria-live="polite">請選方向。</div><div class="actions"><button id="nextBtn" class="primary" hidden>找終點</button></div></section>
<section id="result" class="card" hidden><h2>正負數減法｜本次練習結果</h2><div id="resultIdentity" class="result-id"></div><div id="resultTime" class="muted"></div><div class="metrics"><div class="metric">兩步都首次答對<strong id="perfect"></strong></div><div class="metric">各步首次答對率<strong id="rate"></strong></div></div>
<table><tbody><tr><th>總題數</th><td id="total"></td></tr><tr><th>方向首次答對</th><td id="directionScore"></td></tr><tr><th>終點首次答對</th><td id="endpointScore"></td></tr></tbody></table><div class="actions"><button id="againBtn" class="primary">再練一次</button><button id="settingsBtn">更改題數</button><button id="newStudentBtn">換人練習</button></div></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
let session=null,current=null,stage=0,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestions(count){const pos=[],neg=[];for(let a=-5;a<=5;a++)for(let b=-5;b<=5;b++){if(b===0)continue;(b>0?pos:neg).push({a,b,ans:a-b})}shuffle(pos);shuffle(neg);const start=Math.random()<.5;const qs=[];for(let i=0;i<count;i++)qs.push(((i%2===0)===start?pos:neg).pop());return shuffle(qs)}
function fmt(n){return n<0?`(${n})`:`(+${n})`}
function movement(){return current.b>0?'left':'right'}
function movementText(){return current.b>0?'往左':'往右'}
function directionExplanation(){return current.b>0?`加上正${current.b}會往右；減去正${current.b}，方向相反，要往左走 ${current.b} 格。`:`加上負${-current.b}會往左；減去負${-current.b}，方向相反，要往右走 ${-current.b} 格。`}
function svgElement(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;$('lineSvg').appendChild(e)}
const x=n=>(n+10)*48+24;
function drawLine(solved=false,wrong=null){
 const svg=$('lineSvg');svg.replaceChildren();svg.setAttribute('aria-label',solved?`從 ${current.a} ${movementText()}走 ${Math.abs(current.b)} 格，到 ${current.ans}`:`從負10到正10的數線，起點是 ${current.a}`);
 svgElement('line',{x1:8,y1:83,x2:1000,y2:83,stroke:'#7a879c','stroke-width':2});
 for(let n=-10;n<=10;n++)svgElement('line',{x1:x(n),y1:76,x2:x(n),y2:91,stroke:n===0?'#28364d':'#8e9aad','stroke-width':n===0?3:1});
 svgElement('circle',{cx:x(current.a),cy:83,r:7,fill:'#2866c6'});
 svgElement('text',{x:x(current.a),y:111,'text-anchor':'middle','font-size':14,fill:'#2866c6'},'起點');
 if(solved){const dir=current.b>0?-1:1;for(let i=0;i<Math.abs(current.b);i++){const a=x(current.a+dir*i),b=a+dir*48;svgElement('path',{d:`M ${a} 66 Q ${(a+b)/2} 18 ${b} 66`,fill:'none',stroke:'#298254','stroke-width':3});svgElement('polygon',{points:`${b},66 ${b-dir*9},58 ${b-dir*2},53`,fill:'#298254'})}svgElement('circle',{cx:x(current.ans),cy:83,r:7,fill:'#298254'});}
 $('ticks').replaceChildren();for(let n=-10;n<=10;n++){const b=document.createElement('button');b.type='button';b.className='tick'+(n===0?' zero':'')+(n===current.a?' start':'')+(solved&&n===current.ans?' chosen':'')+(wrong===n?' wrong':'');b.textContent=String(n);b.disabled=stage===0||locked;b.setAttribute('aria-label',`選擇終點 ${n}`);b.addEventListener('click',()=>chooseEndpoint(n));$('ticks').appendChild(b)}
}
function centerLine(n){const box=$('lineScroll');box.scrollLeft=Math.max(0,x(n)-box.clientWidth/2)}
function showQuestion(){locked=false;$('problem').textContent=`${current.a} − ${fmt(current.b)} = ?`;$('counter').textContent=`第 ${session.index+1}／${session.total} 題 · ${stage===0?'① 選方向':'② 點終點'}`;$('bar').style.width=(session.index+stage/2)/session.total*100+'%';$('prompt').textContent=stage===0?`從 ${current.a} 開始，要往左還是往右？`:`從 ${current.a} 開始，${movementText()}走 ${Math.abs(current.b)} 格，點選終點。`;$('lineCaption').textContent=`藍點是起點 ${current.a}；${stage===0?'先選方向。':'點選下方數字作答。'}`;$('directionChoices').hidden=stage!==0;for(const b of document.querySelectorAll('[data-direction]'))b.disabled=false;$('feedback').className='feedback';$('feedback').textContent=stage===0?'先選方向，不用急著算答案。':directionExplanation();$('nextBtn').hidden=true;drawLine();requestAnimationFrame(()=>centerLine(current.a))}
function chooseDirection(value){if(locked||stage!==0)return;const r=session.records[session.index],ok=value===movement();if(r.direction===null)r.direction=ok;$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=(ok?'方向答對了！':'再想一想。')+directionExplanation();if(ok){locked=true;for(const b of document.querySelectorAll('[data-direction]'))b.disabled=true;$('nextBtn').textContent='找終點';$('nextBtn').hidden=false}}
function chooseEndpoint(value){if(locked||stage!==1)return;const r=session.records[session.index],ok=value===current.ans;if(r.endpoint===null)r.endpoint=ok;if(!ok){$('feedback').className='feedback bad';$('feedback').textContent=`還沒到正確終點。從藍點 ${current.a} 開始，${movementText()}走 ${Math.abs(current.b)} 格；每格是 1。`;drawLine(false,value);return}locked=true;drawLine(true);$('feedback').className='feedback good';$('feedback').textContent=`終點答對了！從 ${current.a} ${movementText()}走 ${Math.abs(current.b)} 格，到 ${current.ans}。所以 ${current.a} − ${fmt(current.b)} = ${current.ans}。`;$('nextBtn').textContent=session.index+1===session.total?'看結果':'下一題';$('nextBtn').hidden=false;centerLine((current.a+current.ans)/2)}
function startPractice(){const cls=$('studentClass').value.trim(),no=$('studentNo').value.trim(),name=$('studentName').value.trim();if(!cls||!no||!name){$('setupError').textContent='請填寫班級、座號與姓名。';return}$('setupError').textContent='';const total=Number($('questionCount').value);session={cls,no,name,total,index:0,questions:makeQuestions(total),records:Array.from({length:total},()=>({direction:null,endpoint:null}))};current=session.questions[0];stage=0;$('who').textContent=`${cls}班 ${no}號 ${name}`;$('setup').hidden=true;$('result').hidden=true;$('quiz').hidden=false;showQuestion()}
function finish(){const r=session.records,d=r.filter(v=>v.direction).length,e=r.filter(v=>v.endpoint).length,p=r.filter(v=>v.direction&&v.endpoint).length;$('quiz').hidden=true;$('result').hidden=false;$('resultIdentity').textContent=`${session.cls}班　${session.no}號　${session.name}`;$('resultTime').textContent='完成時間：'+new Date().toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});$('perfect').textContent=`${p}／${session.total}`;$('rate').textContent=Math.round((d+e)/(session.total*2)*100)+'%';$('total').textContent=session.total;$('directionScore').textContent=`${d}／${session.total}`;$('endpointScore').textContent=`${e}／${session.total}`;window.scrollTo({top:0,behavior:'smooth'})}
$('nextBtn').addEventListener('click',()=>{if(!locked)return;if(stage===0){stage=1;showQuestion();return}session.index++;if(session.index===session.total){finish();return}stage=0;current=session.questions[session.index];showQuestion()});
for(const b of document.querySelectorAll('[data-direction]'))b.addEventListener('click',()=>chooseDirection(b.dataset.direction));
$('startBtn').addEventListener('click',startPractice);$('againBtn').addEventListener('click',startPractice);$('settingsBtn').addEventListener('click',()=>{$('result').hidden=true;$('setup').hidden=false});$('newStudentBtn').addEventListener('click',()=>{for(const id of ['studentClass','studentNo','studentName'])$(id).value='';$('result').hidden=true;$('setup').hidden=false;$('studentClass').focus()});
</script></body></html>
